name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DishDrop/DishDrop.slnx
      - run: dotnet build DishDrop/DishDrop.slnx --configuration Release --no-restore
      - run: dotnet test DishDrop/DishDrop.slnx --configuration Release --no-build
